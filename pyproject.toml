[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceatlas"
version = "0.4.0"
description = "Evidence-preserving company research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
traceatlas = "traceatlas.cli:main"
traceatlas-audit = "traceatlas.audit:main"

[tool.setuptools.packages.find]
include = ["traceatlas*"]
exclude = ["tests*", "examples*"]
